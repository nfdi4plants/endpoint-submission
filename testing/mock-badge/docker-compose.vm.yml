# Override file for running the mock badge stack on a VM. It rebinds every published port of the
# main file to the loopback interface. Docker-published ports bypass the host firewall, so without
# this file Postgres (postgres/postgres), Adminer and the service listen on every interface.
# Use it together with the main file and the mock file, from the repository root:
#   docker compose -f docker-compose.yml -f testing/mock-badge/docker-compose.mock.yml -f testing/mock-badge/docker-compose.vm.yml up -d --build
# The !override tag makes Compose replace the ports of the main file, because a plain list would
# merge with them and keep the public binding. It needs Docker Compose 2.24 or later. The mock
# badge already binds 127.0.0.1:8082 in its own file.
services:

  endpointsubmissionservice:
    ports: !override
      - "127.0.0.1:8081:8080"

  submission_db:
    ports: !override
      - "127.0.0.1:5432:5432"

  adminer:
    ports: !override
      - "127.0.0.1:8080:8080"
