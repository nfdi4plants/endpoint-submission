services:

  endpointsubmissionservice:
    image: ${DOCKER_REGISTRY-}endpointsubmissionservice
    container_name: endpoint_submission_service
    build:
      context: .
      dockerfile: src/EndpointSubmission.Service/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - PostgresConnectionString=Host=submission_db;Port=5432;Database=endpoint_submission;Username=postgres;Password=postgres
      # Only hosts listed here may be fetched. Empty means "fetch nothing" — see DataHubUrlGuard.
      - EndpointSubmission__AllowedDataHubHosts__0=gitdev.nfdi4plants.org
      # Never true in a compose file. Production submission is irreversible and must be a
      # deliberate deployment-level decision.
      - EndpointSubmission__AllowProductionTarget=false
      - EndpointSubmission__PublicBaseUrl=http://localhost:8081
      - EndpointSubmission__HookSharedSecret=dev-only-hook-secret-change-me
    networks:
      - endpointsubmission-network
    depends_on:
      submission_db:
        condition: service_healthy

  submission_db:
    image: postgres:16
    container_name: endpoint_submission_database
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=endpoint_submission
    ports:
      - "5432:5432"
    volumes:
      - submission_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d endpoint_submission"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - endpointsubmission-network

  adminer:
    image: adminer
    container_name: endpoint_submission_adminer
    ports:
      - "8080:8080"
    depends_on:
      - submission_db
    networks:
      - endpointsubmission-network

volumes:
  # Named volume rather than ephemeral storage: this database is the only record that a
  # submission ever happened, since nothing is written back to the ARC.
  submission_db_data:

networks:
  endpointsubmission-network:
    driver: bridge
